<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPHAIR Screening Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#000000;
    --bg-grad:#0a0a0a;
    --panel:#141414;
    --panel-2:#1c1c1c;
    --border:#333333;
    --border-soft:#262626;
    --amber:#ff8c00;
    --amber-dim:#cc7000;
    --amber-glow:rgba(255,140,0,0.18);
    --cyan:#5fd3c4;
    --text:#f5f0e8;
    --muted:#a8a29a;
    --muted-2:#767068;
    --danger:#e2574c;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 20% -10%, var(--amber-glow), transparent 60%),
      linear-gradient(180deg, var(--bg-grad) 0%, var(--bg) 100%);
    color:var(--text);
    font-family:Arial, Helvetica, sans-serif;
    min-height:100vh;
    padding:0 0 60px 0;
  }
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px;}

  /* ---------- HEADER / COUNTDOWN ---------- */
  header{
    border-bottom:1px solid var(--border-soft);
    background:linear-gradient(180deg, rgba(18,27,44,0.9), rgba(18,27,44,0.4));
    padding:28px 0 22px 0;
    position:relative;
    overflow:hidden;
  }
  header::before{
    content:"";
    position:absolute; left:0; right:0; top:0;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--amber), transparent);
    opacity:0.7;
  }
  .eyebrow{
    font-family:Arial, Helvetica, sans-serif;
    letter-spacing:0.18em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--amber-dim);
    margin:0 0 6px 0;
  }
  h1{
    font-family:Arial, Helvetica, sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:0.01em;
    margin:0 0 20px 0;
  }
  .countdown-strip{
    display:flex;
    align-items:center;
    gap:22px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 20px;
    flex-wrap:wrap;
  }
  .countdown-digits{
    font-family:Arial, Helvetica, sans-serif;
    font-weight:700;
    font-size:44px;
    color:var(--amber);
    line-height:1;
    text-shadow:0 0 18px var(--amber-glow);
    min-width:90px;
  }
  .countdown-meta{flex:1;min-width:180px;}
  .countdown-label{
    font-family:Arial, Helvetica, sans-serif;
    font-size:12px;
    letter-spacing:0.1em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .countdown-date{
    font-size:13px;
    color:var(--muted-2);
    margin-top:2px;
  }
  .horizon{
    flex-basis:100%;
    height:6px;
    border-radius:4px;
    overflow:hidden;
    background:var(--border-soft);
    margin-top:4px;
  }
  .horizon-fill{
    height:100%;
    background:linear-gradient(90deg, var(--amber-dim), var(--amber));
    transition:width 0.6s ease;
  }

  /* ---------- GRID ---------- */
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-top:24px;
  }
  @media (max-width:720px){
    .grid{grid-template-columns:1fr;}
  }

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px 18px 16px 18px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .icon-box{
    width:42px;height:42px;
    flex:0 0 42px;
    border-radius:8px;
    background:var(--panel-2);
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    color:var(--amber);
  }
  .icon-box svg{width:24px;height:24px;}
  .card-title{flex:1;min-width:0;}
  .card-abbr{
    font-family:Arial, Helvetica, sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.06em;
    color:var(--amber);
  }
  .card-name{
    font-family:Arial, Helvetica, sans-serif;
    font-size:15px;
    color:var(--text);
    margin-top:1px;
  }
  .card-latest{
    font-family:Arial, Helvetica, sans-serif;
    font-size:22px;
    font-weight:700;
    color:var(--text);
    text-align:right;
  }
  .card-latest small{
    display:block;
    font-family:Arial, Helvetica, sans-serif;
    font-weight:400;
    font-size:10px;
    color:var(--muted-2);
    text-align:right;
    letter-spacing:0.06em;
    text-transform:uppercase;
  }

  .chart-holder{
    height:90px;
    position:relative;
  }
  .empty-state{
    font-size:12.5px;
    color:var(--muted);
    padding:14px 2px;
    border-top:1px dashed var(--border-soft);
    border-bottom:1px dashed var(--border-soft);
  }

  form.entry-form{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center;
  }
  .entry-form input[type=date],
  .entry-form input[type=number]{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    font-family:Arial, Helvetica, sans-serif;
    font-size:12.5px;
    padding:8px 9px;
    border-radius:6px;
    outline:none;
  }
  .entry-form input[type=date]{flex:1;min-width:126px;}
  .entry-form input[type=number]{width:78px;}
  .entry-form input:focus{border-color:var(--amber-dim);}
  .entry-form button{
    background:var(--amber);
    color:#1a1305;
    border:none;
    font-family:Arial, Helvetica, sans-serif;
    font-weight:600;
    font-size:12.5px;
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
    transition:filter 0.15s ease;
  }
  .entry-form button:hover{filter:brightness(1.08);}

  .toggle-history{
    background:none;
    border:none;
    color:var(--muted);
    font-family:Arial, Helvetica, sans-serif;
    font-size:11px;
    letter-spacing:0.05em;
    cursor:pointer;
    padding:0;
    text-align:left;
    text-transform:uppercase;
  }
  .toggle-history:hover{color:var(--amber);}

  table.history{
    width:100%;
    border-collapse:collapse;
    font-size:12.5px;
    margin-top:4px;
  }
  table.history th{
    text-align:left;
    color:var(--muted-2);
    font-weight:500;
    font-size:10.5px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:4px 6px;
    border-bottom:1px solid var(--border-soft);
  }
  table.history td{
    padding:6px 6px;
    border-bottom:1px solid var(--border-soft);
    font-family:Arial, Helvetica, sans-serif;
    color:var(--text);
  }
  table.history td.del{
    text-align:right;
  }
  table.history button.del-btn{
    background:none;border:none;color:var(--muted-2);
    cursor:pointer;font-size:13px;
  }
  table.history button.del-btn:hover{color:var(--danger);}
  .hidden{display:none;}

  footer{
    max-width:1040px;margin:30px auto 0 auto;padding:0 20px;
    color:var(--muted-2);font-size:11.5px;
    font-family:Arial, Helvetica, sans-serif;
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <p class="eyebrow">Pilot Screening &middot; SPHAIR Dübendorf</p>
    <h1>Fortschritts-Tracker</h1>
    <div class="countdown-strip">
      <div class="countdown-digits" id="countdownDays">--</div>
      <div class="countdown-meta">
        <div class="countdown-label">Tage bis zum Screening</div>
        <div class="countdown-date">Zieldatum: 4. November</div>
      </div>
      <div class="horizon"><div class="horizon-fill" id="horizonFill" style="width:0%"></div></div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="grid" id="cardGrid"></div>
</div>

<footer>Deine Einträge werden automatisch gespeichert und bleiben erhalten.</footer>

<script>
const TARGET_DATE = new Date('2026-11-04T00:00:00');

const DEPARTMENTS = [
  { abbr:'ENS', name:'Englisch', sub:'Grammatik, Sprache & Zeitformen', icon:'flag' },
  { abbr:'KRN', name:'Kopfrechnen', sub:'Mentale Arithmetik unter Zeitdruck', icon:'brain' },
  { abbr:'OWT', name:'Optischer Wahrnehmungstest', sub:'Visuelle Wahrnehmung & Mustererkennung', icon:'eye' },
  { abbr:'RAG', name:'Mathematik & Logisches Denken', sub:'Rechnen, Algebra & logisches Schliessen', icon:'grid' },
  { abbr:'ROT', name:'Würfelrotationstest', sub:'Räumliche Vorstellung & Rotation', icon:'cube' },
  { abbr:'SKT', name:'Konzentration (Dreieck-Test)', sub:'Daueraufmerksamkeit & Genauigkeit', icon:'triangle' },
  { abbr:'TVT', name:'Technikverständnis', sub:'Physikalisch-technisches Verständnis', icon:'gear' },
  { abbr:'VMC', name:'Visueller Gedächtnistest', sub:'Merkfähigkeit für visuelle Muster', icon:'target' },
];

const ICONS = {
  flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 3v18"/><path d="M5 4h13l-3 4 3 4H5"/></svg>',
  brain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-1 5.8A3.5 3.5 0 0 0 8 18h1V4H9Z"/><path d="M15 4a3 3 0 0 1 3 3 3 3 0 0 1 1 5.8A3.5 3.5 0 0 1 16 18h-1V4h1Z"/><path d="M12 4v14"/></svg>',
  eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 12s3.8-6.5 10-6.5S22 12 22 12s-3.8 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/></svg>',
  grid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
  cube: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3 4 7v10l8 4 8-4V7z"/><path d="M4 7l8 4 8-4"/><path d="M12 11v10"/></svg>',
  triangle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 4 3 20h18Z"/><circle cx="9.2" cy="16" r="0.9" fill="currentColor" stroke="none"/><circle cx="14.8" cy="16" r="0.9" fill="currentColor" stroke="none"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.4M12 18.6V21M21 12h-2.4M5.4 12H3M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7M18.4 18.4l-1.7-1.7M7.3 7.3 5.6 5.6"/></svg>',
  target: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>',
};

const charts = {};
const state = {};

function updateCountdown(){
  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diffMs = TARGET_DATE - startOfToday;
  const days = Math.ceil(diffMs / 86400000);
  document.getElementById('countdownDays').textContent = days >= 0 ? days : 0;
  const totalWindow = 240; // approx visual reference window in days
  const pct = Math.max(0, Math.min(100, 100 - (days/totalWindow*100)));
  document.getElementById('horizonFill').style.width = pct + '%';
}

async function loadEntries(abbr){
  try{
    const res = await window.storage.get('sphair:' + abbr, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      return Array.isArray(parsed) ? parsed : [];
    }
    return [];
  }catch(e){
    return [];
  }
}

async function saveEntries(abbr, entries){
  try{
    await window.storage.set('sphair:' + abbr, JSON.stringify(entries), false);
  }catch(e){
    console.error('Speichern fehlgeschlagen', e);
  }
}

function todayISO(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,10);
}

function buildCard(dep){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-head">
      <div class="icon-box">${ICONS[dep.icon]}</div>
      <div class="card-title">
        <div class="card-abbr">${dep.abbr}</div>
        <div class="card-name">${dep.name}</div>
      </div>
      <div class="card-latest" id="latest-${dep.abbr}"><small>Letzter Wert</small>--</div>
    </div>
    <div class="chart-holder"><canvas id="chart-${dep.abbr}"></canvas></div>
    <div class="empty-state hidden" id="empty-${dep.abbr}">Noch keine Einträge – trag dein erstes Ergebnis ein.</div>
    <form class="entry-form" id="form-${dep.abbr}">
      <input type="date" id="date-${dep.abbr}" required>
      <input type="number" id="percent-${dep.abbr}" min="0" max="100" step="1" placeholder="%" required>
      <button type="submit">Eintragen</button>
    </form>
    <button class="toggle-history" id="toggle-${dep.abbr}">Verlauf anzeigen ▾</button>
    <div class="hidden" id="historyWrap-${dep.abbr}">
      <table class="history">
        <thead><tr><th>Datum</th><th>Erfolg</th><th></th></tr></thead>
        <tbody id="historyBody-${dep.abbr}"></tbody>
      </table>
    </div>
  `;
  return card;
}

function renderChart(abbr, entries){
  const ctx = document.getElementById('chart-' + abbr);
  const sorted = [...entries].sort((a,b)=> a.date.localeCompare(b.date));
  const labels = sorted.map(e=>{
    const [y,m,d] = e.date.split('-');
    return d + '.' + m;
  });
  const data = sorted.map(e=>e.percent);

  if(charts[abbr]){
    charts[abbr].data.labels = labels;
    charts[abbr].data.datasets[0].data = data;
    charts[abbr].update();
    return;
  }

  charts[abbr] = new Chart(ctx, {
    type:'line',
    data:{
      labels,
      datasets:[{
        data,
        borderColor:'#ff8c00',
        backgroundColor:'rgba(255,140,0,0.12)',
        borderWidth:2,
        pointRadius:3,
        pointBackgroundColor:'#ff8c00',
        pointBorderColor:'#000000',
        tension:0.3,
        fill:true,
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      animation:{duration:300},
      plugins:{ legend:{display:false}, tooltip:{
        backgroundColor:'#1c1c1c', borderColor:'#333333', borderWidth:1,
        titleColor:'#8492a6', bodyColor:'#eaeef5', displayColors:false,
        callbacks:{ label:(ctx)=> ctx.parsed.y + ' %' }
      }},
      scales:{
        x:{ grid:{color:'#262626'}, ticks:{color:'#767068', font:{size:9}} },
        y:{ min:0, max:100, grid:{color:'#262626'}, ticks:{color:'#767068', font:{size:9}, stepSize:25} }
      }
    }
  });
}

function renderHistory(abbr, entries){
  const body = document.getElementById('historyBody-' + abbr);
  const sorted = [...entries].sort((a,b)=> b.date.localeCompare(a.date));
  body.innerHTML = sorted.map(e=>{
    return `<tr><td>${formatDate(e.date)}</td><td>${e.percent}%</td>
      <td class="del"><button class="del-btn" data-abbr="${abbr}" data-date="${e.date}" title="Löschen">✕</button></td></tr>`;
  }).join('');
  body.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const a = btn.getAttribute('data-abbr');
      const dt = btn.getAttribute('data-date');
      state[a] = state[a].filter(e => e.date !== dt);
      await saveEntries(a, state[a]);
      refreshCard(a);
    });
  });
}

function formatDate(iso){
  const [y,m,d] = iso.split('-');
  return d + '.' + m + '.' + y;
}

function refreshCard(abbr){
  const entries = state[abbr];
  const empty = document.getElementById('empty-' + abbr);
  const latestBox = document.getElementById('latest-' + abbr);

  if(entries.length === 0){
    empty.classList.remove('hidden');
    latestBox.innerHTML = '<small>Letzter Wert</small>--';
  } else {
    empty.classList.add('hidden');
    const sorted = [...entries].sort((a,b)=> a.date.localeCompare(b.date));
    const last = sorted[sorted.length - 1];
    latestBox.innerHTML = `<small>Letzter Wert</small>${last.percent}%`;
  }
  renderChart(abbr, entries);
  renderHistory(abbr, entries);
}

async function init(){
  updateCountdown();
  setInterval(updateCountdown, 60000);

  const grid = document.getElementById('cardGrid');
  DEPARTMENTS.forEach(dep => grid.appendChild(buildCard(dep)));

  for(const dep of DEPARTMENTS){
    state[dep.abbr] = await loadEntries(dep.abbr);
    document.getElementById('date-' + dep.abbr).value = todayISO();
    refreshCard(dep.abbr);

    document.getElementById('form-' + dep.abbr).addEventListener('submit', async (ev)=>{
      ev.preventDefault();
      const dateVal = document.getElementById('date-' + dep.abbr).value;
      const percentVal = parseInt(document.getElementById('percent-' + dep.abbr).value, 10);
      if(!dateVal || isNaN(percentVal)) return;
      const clamped = Math.max(0, Math.min(100, percentVal));
      const existing = state[dep.abbr].filter(e => e.date !== dateVal);
      existing.push({ date: dateVal, percent: clamped });
      state[dep.abbr] = existing;
      await saveEntries(dep.abbr, existing);
      document.getElementById('percent-' + dep.abbr).value = '';
      refreshCard(dep.abbr);
    });

    document.getElementById('toggle-' + dep.abbr).addEventListener('click', ()=>{
      const wrap = document.getElementById('historyWrap-' + dep.abbr);
      const btn = document.getElementById('toggle-' + dep.abbr);
      const isHidden = wrap.classList.contains('hidden');
      wrap.classList.toggle('hidden');
      btn.textContent = isHidden ? 'Verlauf verbergen ▴' : 'Verlauf anzeigen ▾';
    });
  }
}

init();
</script>
</body>
</html>
